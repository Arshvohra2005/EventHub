<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login | EventHub</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<header class="navbar">

    <div class="container nav-container">

        <a href="index.html" class="logo">
            EventHub
        </a>

        <nav class="nav-links">

            <a href="index.html">
                Home
            </a>

            <a href="index.html#events">
                Events
            </a>

            <a href="signup.html">
                Sign Up
            </a>

            <a href="admin-login.html">
                Admin
            </a>

        </nav>

    </div>

</header>


<main class="auth-page">

    <div class="container">

        <div class="auth-card">

            <div class="auth-header">

                <h1>
                    Welcome Back
                </h1>

                <p>
                    Login to your EventHub account.
                </p>

            </div>


            <form id="loginForm">

                <div class="form-group">

                    <label for="loginEmail">
                        Email
                    </label>

                    <input
                        type="email"
                        id="loginEmail"
                        placeholder="Enter your email"
                        autocomplete="username"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="loginPassword">
                        Password
                    </label>

                    <div class="password-wrapper">

                        <input
                            type="password"
                            id="loginPassword"
                            placeholder="Enter your password"
                            autocomplete="current-password"
                            required
                        >

                        <button
                            type="button"
                            class="password-toggle"
                            onclick="togglePassword('loginPassword', this)"
                        >
                            Show
                        </button>

                    </div>

                </div>


                <button
                    type="submit"
                    class="primary-btn auth-submit"
                >
                    Login
                </button>


                <div
                    id="loginMessage"
                    class="form-message"
                ></div>

            </form>


            <div class="auth-footer">

                <p>
                    Don't have an account?
                    <a href="signup.html">
                        Create Account
                    </a>
                </p>

                <p>
                    Are you an admin?
                    <a href="admin-login.html">
                        Admin Login
                    </a>
                </p>

            </div>

        </div>

    </div>

</main>


<footer class="footer">

    <div class="container footer-content">

        <strong>
            EventHub
        </strong>

        <p>
            Online Event Discovery & Registration Platform
        </p>

    </div>

</footer>


<script src="auth.js"></script>

</body>

</html>
