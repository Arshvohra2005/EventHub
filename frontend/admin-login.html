<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Admin Login | EventHub</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<header class="navbar">

    <div class="container nav-container">

        <a href="index.html" class="logo">
            EventHub
        </a>

        <nav class="nav-links">

            <a href="index.html">
                Home
            </a>

            <a href="login.html">
                User Login
            </a>

        </nav>

    </div>

</header>


<main class="auth-page">

    <div class="auth-card">

        <h1>Admin Login</h1>

        <p>
            Access the EventHub administration dashboard.
        </p>


        <form id="adminLoginForm">

            <div class="form-group">

                <label for="adminEmail">
                    Admin Email
                </label>

                <input
                    type="email"
                    id="adminEmail"
                    placeholder="Enter admin email"
                    required
                >

            </div>


            <div class="form-group">

                <label for="adminPassword">
                    Password
                </label>

                <div class="password-wrapper">

                    <input
                        type="password"
                        id="adminPassword"
                        placeholder="Enter admin password"
                        required
                    >

                    <button
                        type="button"
                        class="password-toggle"
                        onclick="togglePassword('adminPassword', this)"
                    >
                        Show
                    </button>

                </div>

            </div>


            <button
                type="submit"
                class="primary-btn full-btn"
            >
                Admin Login
            </button>


            <div
                id="adminMessage"
                class="form-message"
            ></div>

        </form>


        <div class="auth-footer">

            <a href="login.html">
                ← Back to User Login
            </a>

        </div>

    </div>

</main>


<script src="auth.js"></script>

</body>
</html>
