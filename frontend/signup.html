<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Sign Up | EventHub</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<header class="navbar">

    <div class="container nav-container">

        <a href="index.html" class="logo">
            EventHub
        </a>

        <nav class="nav-links">

            <a href="index.html">
                Home
            </a>

            <a href="index.html#events">
                Events
            </a>

            <a href="login.html">
                Login
            </a>

            <a href="admin-login.html">
                Admin
            </a>

        </nav>

    </div>

</header>


<main class="auth-page">

    <div class="container">

        <div class="auth-card">

            <div class="auth-header">

                <h1>
                    Create Account
                </h1>

                <p>
                    Join EventHub and register for
                    exciting events.
                </p>

            </div>


            <form id="signupForm">

                <div class="form-group">

                    <label for="signupName">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="signupName"
                        placeholder="Enter your full name"
                        autocomplete="name"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="signupEmail">
                        Email
                    </label>

                    <input
                        type="email"
                        id="signupEmail"
                        placeholder="Enter your email"
                        autocomplete="email"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="signupPassword">
                        Password
                    </label>

                    <div class="password-wrapper">

                        <input
                            type="password"
                            id="signupPassword"
                            placeholder="Minimum 6 characters"
                            autocomplete="new-password"
                            required
                        >

                        <button
                            type="button"
                            class="password-toggle"
                            onclick="togglePassword('signupPassword', this)"
                        >
                            Show
                        </button>

                    </div>

                </div>


                <div class="form-group">

                    <label for="confirmPassword">
                        Confirm Password
                    </label>

                    <div class="password-wrapper">

                        <input
                            type="password"
                            id="confirmPassword"
                            placeholder="Re-enter your password"
                            autocomplete="new-password"
                            required
                        >

                        <button
                            type="button"
                            class="password-toggle"
                            onclick="togglePassword('confirmPassword', this)"
                        >
                            Show
                        </button>

                    </div>

                </div>


                <button
                    type="submit"
                    class="primary-btn auth-submit"
                >
                    Create Account
                </button>


                <div
                    id="signupMessage"
                    class="form-message"
                ></div>

            </form>


            <div class="auth-footer">

                <p>
                    Already have an account?
                    <a href="login.html">
                        Login
                    </a>
                </p>

            </div>

        </div>

    </div>

</main>


<footer class="footer">

    <div class="container footer-content">

        <strong>
            EventHub
        </strong>

        <p>
            Online Event Discovery & Registration Platform
        </p>

    </div>

</footer>


<script src="auth.js"></script>

</body>

</html>
