<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Event Details | EventHub</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<header class="navbar">

    <div class="container nav-container">

        <a href="index.html" class="logo">
            EventHub
        </a>

        <nav class="nav-links">

            <a href="index.html">
                Home
            </a>

            <a href="index.html#events">
                Events
            </a>

            <a href="registrations.html">
                My Registrations
            </a>

            <a
                href="login.html"
                class="nav-btn"
                id="loginNavBtn"
            >
                Login
            </a>

            <a
                href="signup.html"
                class="nav-btn"
                id="signupNavBtn"
            >
                Sign Up
            </a>

            <a
                href="#"
                class="nav-btn"
                id="logoutNavBtn"
                onclick="handleLogout(); return false;"
                style="display: none;"
            >
                Logout
            </a>

        </nav>

    </div>

</header>


<main class="event-detail">

    <div class="container">

        <div
            id="eventContainer"
            class="detail-card"
        >

            <div class="loading">
                Loading event...
            </div>

        </div>

    </div>

</main>


<footer class="footer">

    <div class="container footer-content">

        <strong>
            EventHub
        </strong>

        <p>
            Online Event Discovery & Registration Platform
        </p>

    </div>

</footer>


<script>

const API_URL =
    window.location.hostname === "localhost" ||
    window.location.hostname === "127.0.0.1"
        ? "http://localhost:5000/api"
        : "https://eventhub-production.up.railway.app/api";


const eventContainer =
    document.getElementById(
        "eventContainer"
    );


// ======================================================
// ESCAPE HTML
// ======================================================

function escapeHTML(value) {

    const div =
        document.createElement("div");

    div.textContent =
        value ?? "";

    return div.innerHTML;

}


// ======================================================
// LOGOUT
// ======================================================

function handleLogout() {

    localStorage.removeItem(
        "eventhubToken"
    );

    localStorage.removeItem(
        "currentUser"
    );

    window.location.href =
        "index.html";

}


// ======================================================
// UPDATE NAVBAR
// ======================================================

function updateNavbar() {

    const token =
        localStorage.getItem(
            "eventhubToken"
        );

    const loginButton =
        document.getElementById(
            "loginNavBtn"
        );

    const signupButton =
        document.getElementById(
            "signupNavBtn"
        );

    const logoutButton =
        document.getElementById(
            "logoutNavBtn"
        );


    if (token) {

        if (loginButton) {
            loginButton.style.display =
                "none";
        }

        if (signupButton) {
            signupButton.style.display =
                "none";
        }

        if (logoutButton) {
            logoutButton.style.display =
                "inline-block";
        }

    } else {

        if (loginButton) {
            loginButton.style.display =
                "inline-block";
        }

        if (signupButton) {
            signupButton.style.display =
                "inline-block";
        }

        if (logoutButton) {
            logoutButton.style.display =
                "none";
        }

    }

}


// ======================================================
// GET EVENT ID
// ======================================================

const params =
    new URLSearchParams(
        window.location.search
    );


const eventId =
    params.get("id");


// ======================================================
// LOAD EVENT
// ======================================================

async function loadEvent() {

    if (!eventId) {

        eventContainer.innerHTML = `

            <div class="message-box">

                <h3>
                    Event not found.
                </h3>

                <br>

                <a
                    href="index.html#events"
                    class="primary-btn"
                >
                    Back to Events
                </a>

            </div>

        `;

        return;
    }


    try {

        const response =
            await fetch(
                `${API_URL}/events/${eventId}`
            );


        const event =
            await response.json();


        if (!response.ok) {

            throw new Error(
                event.message ||
                "Unable to load event."
            );

        }


        const image =
            event.image ||
            "https://images.unsplash.com/photo-1506157786151-b8491531f063?auto=format&fit=crop&w=1200&q=80";


        eventContainer.innerHTML = `

            <img
                src="${escapeHTML(image)}"
                alt="${escapeHTML(event.title)}"
                class="detail-image"
            >


            <div class="detail-content">

                <h1>
                    ${escapeHTML(event.title)}
                </h1>


                <p class="detail-description">
                    ${escapeHTML(event.description)}
                </p>


                <div class="detail-info">

                    <div>
                        📅
                        <strong>Date:</strong>
                        ${escapeHTML(event.date)}
                    </div>

                    <div>
                        🕐
                        <strong>Time:</strong>
                        ${escapeHTML(event.time)}
                    </div>

                    <div>
                        📍
                        <strong>Location:</strong>
                        ${escapeHTML(event.location)}
                    </div>

                </div>


                <button
                    class="primary-btn"
                    onclick="registerEvent(${event.id})"
                >
                    Register for Event
                </button>


                <a
                    href="index.html#events"
                    class="secondary-btn"
                >
                    Back to Events
                </a>

            </div>

        `;


    } catch (error) {

        eventContainer.innerHTML = `

            <div class="message-box">

                <h3>
                    Unable to load event
                </h3>

                <p>
                    ${escapeHTML(
                        error.message
                    )}
                </p>

                <br>

                <a
                    href="index.html#events"
                    class="primary-btn"
                >
                    Back to Events
                </a>

            </div>

        `;

    }

}


// ======================================================
// REGISTER EVENT
// ======================================================

async function registerEvent(id) {

    const token =
        localStorage.getItem(
            "eventhubToken"
        );


    if (!token) {

        window.location.href =
            `login.html?redirect=event.html?id=${id}`;

        return;
    }


    try {

        const response =
            await fetch(
                `${API_URL}/registrations`,
                {
                    method: "POST",

                    headers: {

                        "Content-Type":
                            "application/json",

                        "Authorization":
                            `Bearer ${token}`

                    },

                    body: JSON.stringify({
                        eventId: id
                    })

                }
            );


        const data =
            await response.json();


        if (
            response.status === 401 ||
            response.status === 403
        ) {

            localStorage.removeItem(
                "eventhubToken"
            );

            localStorage.removeItem(
                "currentUser"
            );

            window.location.href =
                `login.html?redirect=event.html?id=${id}`;

            return;
        }


        alert(
            data.message ||
            "Registration completed."
        );


    } catch (error) {

        alert(
            "Unable to connect to EventHub server."
        );

    }

}


// ======================================================
// INITIALIZE
// ======================================================

updateNavbar();

loadEvent();

</script>

</body>

</html>
